workers: 56
output_dir: results/m5_noregress

note: "(instance, trial) pairing [CLI]; paper3 M5 no-regression: p3 arms vs minorminer on the structured+lattice presets (expanded union, see header); pegasus_16, 60 s, eval master seed 4242; walls are within-batch context only (56 workers > the 48-worker limit for wall_time tables — rule 5)"
