# docs/paper3/experiments/m5_noregress.yaml
# =============================================================================
# M5 — structured/lattice no-regression sweep (paper3; CLI route).
#
# Protocol notes (protocol.md):
#   - Rule 1: the CLI salts per-trial seeds with the algorithm name, so this
#     batch is "(instance, trial) pairing [CLI]" — breadth sweep, never pooled
#     with script-route statistics.
#   - Rule 3 caveat: the CLI computes no spur-pruned column; the analysis
#     (docs/paper3/data/m5_analyze.py) pairs raw avg_chain_length vs raw
#     avg_chain_length for every arm — stated in its output.
#   - Pre-registered M5 bar (notes.md §4.x entry before launch): per manifest
#     family, FAIL if any p3 arm vs minorminer has mean dACL > +0.10 or a
#     success-rate drop > 1 percentage point.
#
# graphs: the union of the packaged presets `structured` + `lattice`
#   (packages/ember-qc/src/ember_qc/graphs/presets.csv). The selection parser
#   (ember_qc.load_graphs.parse_graph_selection) resolves a preset name only
#   when it is the ENTIRE selection string — "structured, lattice" is NOT
#   valid syntax — so the two presets' selection strings are expanded
#   verbatim below (verified to parse to the identical 3,388-graph union;
#   ~3,352 are pegasus-compatible per the manifest, the rest are skipped by
#   the pre-run compatibility check).
#
# Run (hyde06, from /data/dabh/ember, after `ember graphs install structured`
# and `ember graphs install lattice`):
#   .venv/bin/ember run docs/paper3/experiments/m5_noregress.yaml
# Analysis (local): .venv/bin/python docs/paper3/data/m5_analyze.py <batch_dir>
# =============================================================================

name: m5_structured_noregress

algorithms:
